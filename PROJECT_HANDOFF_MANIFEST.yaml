    - tracked model checkpoints and generated ablation workspaces
    - generated fingerprints, provenance, reproducibility, and cross-run scratch directories
    - virtual environments
    - Python bytecode and __pycache__ directories
    - pytest, Ruff, and coverage caches
    - duplicate historical migration matrices superseded by current copies
    - generated HTML coverage bulk; XML and the concise Markdown report are retained
    - prior delivery archives
    - temporary logs and scratch scripts
  rehydration:
    install: pip install -e '.[dev,benchmark]'
    test: PYTHONPATH=src python -m pytest -q
    lint: python -m ruff check src tests benchmarks
    build: python -m build
  primary_reading_order:
