priority_order:
  - priority: 1
    target: active-stage hardening and release gates
    status: in_progress
    why: >-
      The largest immediate release risk is low exercised coverage in model export,
      calibrated quantization, memory telemetry, provenance, and hardware branches.
    work:
      - add deterministic adapter/model fixtures for export and quantization
      - cover memory RSS fallback and accelerator allocation branches
      - test provenance hash binding and artifact reload failures
      - add atomic-write, rollback, cancellation, and failure-redaction tests
    acceptance: no untested release-critical branch and no silent optional-dependency skip
  - priority: 2
    target: Phase C resource-budget profiling
    status: initiated
    why: >-
      Memory and throughput measurements are prerequisites for safe optimization.
    work:
      - add OOM recovery and per-candidate timeout/cancellation
      - correlate host RSS, accelerator allocation, batch size, sequence length, and throughput
      - add resource ceilings and machine-readable budget violations
      - preserve before/after quality gates for every selected configuration
    acceptance: report-only profiler with bounded execution and reproducible budget evidence
  - priority: 3
    target: KV-cache and sequence-length profiling
    status: unavailable_prototype
    why: >-
      Cache behavior is the next largest throughput/memory driver for autoregressive inference.
    work:
      - profile cache enabled versus disabled
      - sweep bounded context lengths
      - measure memory growth and tokens/second
      - reject cache configurations that change outputs beyond tolerance
    acceptance: deterministic report plus quality and memory regression gates
  - priority: 4
    target: hardware matrix execution
    status: environment_blocked
    why: >-
      CPU ARM64 evidence cannot establish CUDA, x86-64, mobile, distributed, or thermal claims.
    work:
      - run pinned benchmark matrix on CUDA and x86-64
      - add mobile/edge power and thermal runner evidence
      - record driver, accelerator, framework, and kernel versions
    acceptance: separate evidence per target, never an inferred pass
  - priority: 5
    target: quantization backend qualification
    status: environment_blocked
    why: Optimum Quanto is not installed and accelerator paths are unavailable here.
    work:
      - install the locked quantization extra in a controlled runner
      - execute full-precision versus Quanto quality matrix
      - verify artifact reload, metric finiteness, and revision provenance
    acceptance: valid comparative rows for each selected model and mode
  - priority: 6
    target: deployment and distributed planning
    status: unavailable_prototype
    why: Placement, distributed inference, and on-device constraints need measured resource contracts.
    work:
      - promote report-only device placement planner
      - add distributed topology and failure reporting
      - add mobile/edge package-size and memory ceilings
    acceptance: plan-only output with explicit unsupported-backend failures
  - priority: 7
    target: mutating optimization stages
    status: blocked_until_gates
    why: >-
      Performance, cache, batch, and scheme selectors must not mutate or choose policies
      without quality, resource, reproducibility, and rollback evidence.
    work:
      - implement before/after objective comparison
      - add rollback checkpoints and artifact manifests
      - add stop conditions and regression tolerance policy
    acceptance: measurable improvement with no material quality regression and tested rollback
  - priority: 8
    target: runtime mapping promotion gate
    status: complete
    why: >-
      Discovery evidence must not authorize mutation until replayability, schema integrity,
      model identity, and regression evidence are independently validated.
    work:
      - validate deterministic experiment IDs and measurement signatures
      - require replay results with matching signatures
      - require finite passed regression metrics and no listed regressions
      - issue a versioned capability record consumed by the mutation firewall
    acceptance: promoted capability validates by schema signature and digest and rejects tampering
known_breakages_and_errors:
  - issue: Optimum Quanto is unavailable in the current environment
    impact: calibrated quantization integration tests and full quantization quality rows remain skipped or blocked
    remedy: install the quantization extra in a controlled compatible runner
  - issue: accelerator backends are unavailable
    impact: CUDA, XPU, HPU, NPU, MPS, distributed, mobile, and thermal qualification cannot run here
    remedy: execute the hardware matrix on target runners
  - issue: project-wide coverage is 34 percent
    impact: broad prototype inventory and release-critical optional branches remain lightly exercised
    remedy: prioritize deterministic fixtures for export, quantization, memory, provenance, and hardware paths
  - issue: latency and throughput stages are diagnostic only
    impact: they measure but do not optimize or select deployment policy
    remedy: retain opt-in report-only behavior until quality and rollback gates exist
  - issue: 78 switches remain unavailable
    impact: prototype roadmap is not complete
    remedy: promote one workstream at a time using the callable contract and evidence gates
  - issue: active-stage coverage for memory, model export, quantization, provenance, and weight fingerprinting is low
    impact: these are release-risk areas despite passing tests
    remedy: add direct contract and failure-path tests before release claims
recommended_additional_modules:
  - id: resource_budget_gate
    purpose: Compare memory, latency, throughput, and quality against configurable budgets.
    priority: high
  - id: oom_recovery_and_cancellation
    purpose: Abort a candidate safely, release resources, and preserve a failed measurement record.
    priority: high
  - id: kv_cache_profiler
    purpose: Measure cache memory growth, context-length sensitivity, and output stability.
    priority: high
  - id: hardware_capability_matrix_runner
    purpose: Execute the same benchmark contract across CPU, CUDA, x86-64, edge, and distributed targets.
    priority: high
  - id: benchmark_manifest_and_dataset_lock
    purpose: Bind model revisions, dataset fingerprints, prompt digests, seeds, and runtime versions.
    priority: high
  - id: rollback_checkpoint_manager
    purpose: Create atomic checkpoints and restore model/export state after failed optimizations.
    priority: high
  - id: structured_quality_gate
    purpose: Enforce metric-specific tolerances for capability, refusal, safety, and output-format behavior.
    priority: medium
  - id: observability_exporter
    purpose: Emit OpenTelemetry-compatible stage timings, resource metrics, and failure categories without raw prompts.
    priority: medium
  - id: model_artifact_signing
    purpose: Sign manifests and bind model/config/state hashes to exported artifacts.
    priority: medium
  - id: plugin_api_versioning
    purpose: Version stage contracts and reject incompatible third-party stage plugins.
    priority: medium
  - id: reproducible_container_or_lockfile
    purpose: Make benchmark and release environments reconstructible across hardware runners.
    priority: medium
